name: Construcao do backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/deploy-railway
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Gerar scripts de construcao
        run: mvn -B generate-resources

      - name: Compilar, testar e gerar documentacao
        run: sh target/scripts/construir.sh -B

      - name: Mostrar recompilacao minima
        run: mvn -B compile

      - name: Salvar executavel
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/deploy-railway/target/*.jar
          if-no-files-found: error

      - name: Salvar documentacao, scripts e relatorios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentacao-e-relatorios
          path: |
            backend/deploy-railway/target/site/
            backend/deploy-railway/target/scripts/
            backend/deploy-railway/target/surefire-reports/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_RAILWAY == 'true'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v7

      - name: Baixar o executavel
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend/deploy-railway/target

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy no Railway
        run: railway up --service "$RAILWAY_SERVICE" --ci --no-gitignore
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
